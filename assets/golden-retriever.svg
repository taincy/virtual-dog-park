<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Illustration of a Golden Retriever">
  <title>Golden Retriever illustration</title>
  <circle cx="100" cy="100" r="96" fill="#fdf4e0" />
  <!-- soft ears -->
  <ellipse cx="50" cy="104" rx="20" ry="40" fill="#d8a03a" transform="rotate(-12 50 104)" />
  <ellipse cx="150" cy="104" rx="20" ry="40" fill="#d8a03a" transform="rotate(12 150 104)" />
  <!-- head -->
  <ellipse cx="100" cy="88" rx="48" ry="45" fill="#e9b955" />
  <!-- lighter muzzle area -->
  <ellipse cx="100" cy="108" rx="34" ry="26" fill="#f2cb78" />
  <!-- eyes -->
  <circle cx="82" cy="82" r="5.5" fill="#3a2a1a" />
  <circle cx="118" cy="82" r="5.5" fill="#3a2a1a" />
  <circle cx="83.6" cy="80.2" r="1.8" fill="#ffffff" />
  <circle cx="119.6" cy="80.2" r="1.8" fill="#ffffff" />
  <!-- nose and mouth -->
  <ellipse cx="100" cy="100" rx="11" ry="8" fill="#3a2a1a" />
  <path d="M100 108v7" stroke="#3a2a1a" stroke-width="2.5" stroke-linecap="round" />
  <path d="M100 116c-4 6-11 7-14 2" fill="none" stroke="#3a2a1a" stroke-width="2.5" stroke-linecap="round" />
  <path d="M100 116c4 6 11 7 14 2" fill="none" stroke="#3a2a1a" stroke-width="2.5" stroke-linecap="round" />
  <!-- happy tongue -->
  <path d="M94 124c0 6 3 9 6 9s6-3 6-9z" fill="#e8798c" />
  <!-- head tuft -->
  <path d="M82 50c6-8 14-12 18-12s12 4 18 12" fill="none" stroke="#c98f28" stroke-width="3" stroke-linecap="round" />
</svg>
