<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Illustration of a Poodle">
  <title>Poodle illustration</title>
  <circle cx="100" cy="100" r="96" fill="#f4f1fb" />
  <!-- curly top knot -->
  <circle cx="100" cy="40" r="15" fill="#f8f4ec" stroke="#cfc6e2" stroke-width="2" />
  <circle cx="82" cy="48" r="13" fill="#f8f4ec" stroke="#cfc6e2" stroke-width="2" />
  <circle cx="118" cy="48" r="13" fill="#f8f4ec" stroke="#cfc6e2" stroke-width="2" />
  <circle cx="100" cy="56" r="14" fill="#f8f4ec" stroke="#cfc6e2" stroke-width="2" />
  <!-- long groomed ears -->
  <ellipse cx="54" cy="108" rx="16" ry="42" fill="#efe9dd" stroke="#cfc6e2" stroke-width="2" transform="rotate(-8 54 108)" />
  <ellipse cx="146" cy="108" rx="16" ry="42" fill="#efe9dd" stroke="#cfc6e2" stroke-width="2" transform="rotate(8 146 108)" />
  <!-- slim head -->
  <ellipse cx="100" cy="88" rx="38" ry="42" fill="#f8f4ec" stroke="#cfc6e2" stroke-width="2" />
  <!-- long muzzle -->
  <ellipse cx="100" cy="112" rx="21" ry="24" fill="#fdfbf7" stroke="#cfc6e2" stroke-width="2" />
  <!-- eyes -->
  <circle cx="85" cy="82" r="5" fill="#241c2e" />
  <circle cx="115" cy="82" r="5" fill="#241c2e" />
  <circle cx="86.5" cy="80.4" r="1.6" fill="#ffffff" />
  <circle cx="116.5" cy="80.4" r="1.6" fill="#ffffff" />
  <!-- nose -->
  <ellipse cx="100" cy="102" rx="9" ry="7" fill="#241c2e" />
  <path d="M100 109v6" stroke="#241c2e" stroke-width="2.5" stroke-linecap="round" />
  <path d="M100 115c-3 5-8 5-10 1" fill="none" stroke="#241c2e" stroke-width="2.5" stroke-linecap="round" />
  <path d="M100 115c3 5 8 5 10 1" fill="none" stroke="#241c2e" stroke-width="2.5" stroke-linecap="round" />
  <!-- pink bow on the collar -->
  <path d="M78 140l14 8-14 8z" fill="#e8798c" />
  <path d="M122 140l-14 8 14 8z" fill="#e8798c" />
  <circle cx="100" cy="148" r="5" fill="#d95c74" />
</svg>
